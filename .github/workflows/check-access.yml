name: Check Vidhub access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser-compatible HTTP client
        run: python -m pip install curl_cffi==0.16.3
      - name: Verify actual homepage content
        run: |
          python - <<'PY'
          from curl_cffi import requests
          import re, os
          r = requests.get('https://vidhub3.top/', impersonate='chrome', timeout=25)
          links = set(re.findall(r'/voddetail/\d+\.html', r.text))
          title = re.search(r'<title>(.*?)</title>', r.text, re.S)
          result = f'HTTP {r.status_code}; detail links {len(links)}; server {r.headers.get("server")}; cf-mitigated {r.headers.get("cf-mitigated")}; title {title.group(1)[:80] if title else "none"}'
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(result+'\n')
          assert r.status_code == 200 and len(links) >= 3, 'Homepage access is still blocked'
          PY
