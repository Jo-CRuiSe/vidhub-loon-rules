name: Check Vidhub access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify official alternate addresses
        run: |
          python - <<'CHECK'
          import subprocess, tempfile, pathlib, re, os
          # Addresses read from https://vidhub.link/ on 2026-10-14.
          addresses = ['https://vidhub1.cc/', 'https://vidhub2.top/', 'https://vidhub.cc/', 'https://vidhub.tv/']
          successes = []
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for url in addresses:
                  with tempfile.TemporaryDirectory() as tmp:
                      body = pathlib.Path(tmp)/'body'
                      r = subprocess.run(['curl','-L','-sS','--connect-timeout','5','--max-time','20','--max-filesize','2097152','--max-redirs','4','-o',str(body),'-w','%{http_code} %{url_effective}',url],capture_output=True,text=True)
                      content = body.read_text(errors='replace') if body.exists() else ''
                      links = set(re.findall(r'/voddetail/\d+\.html',content))
                      title = re.search(r'<title>(.*?)</title>',content,re.S)
                      message = f'{url}: {r.stdout}; detail links {len(links)}; title {title.group(1)[:60] if title else "none"}'
                      print(message, flush=True)
                      summary.write(message+'\n\n')
                      if r.returncode == 0 and r.stdout.startswith('200 ') and len(links)>=3:
                          successes.append(url)
          assert successes, 'No accessible official alternate address'
          CHECK
