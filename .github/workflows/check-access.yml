name: Check Vidhub access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser-compatible CDN client
        run: python -m pip install curl_cffi==0.16.3
      - name: Verify actual CDN playlists
        run: |
          python - <<'CHECK'
          from curl_cffi import requests
          import json, time, os
          from urllib.parse import urlsplit
          sources=json.load(open('data/cdn-samples.json'))
          successes=0
          with requests.Session(impersonate='chrome') as session, open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              for source in sources:
                  url=source['playlist_url']
                  try:
                      r=session.get(url,timeout=15)
                      valid=r.status_code==200 and r.text.lstrip().startswith('#EXTM3U')
                      successes+=int(valid)
                      line=f'{urlsplit(url).hostname}: HTTP {r.status_code}; HLS {valid}'
                  except Exception as error:
                      line=f'{urlsplit(url).hostname}: {type(error).__name__}'
                  print(line,flush=True)
                  summary.write(line+'\n\n')
                  time.sleep(1.5)
          print('Usable samples:',successes)
          assert successes>=3,'Insufficient usable CDN samples'
          CHECK
